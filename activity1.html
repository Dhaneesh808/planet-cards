<!DOCTYPE html>
<html lang="en">
<head>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1{
            color: #ff5a43;
        }

        #zoo {
            border: 2px solid #ff5a43;
            width: 300px;
            margin: 16px auto;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
        }

        button {
            background: #ff5a43;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Zoo</h1>
    <p>Use Javascript and the DOM to add animals to each cage</p>

    <div id="zoo">
        <div class="zone">Zone 1 <span id="zone1"></span></div>
        <div class="zone">Zone 2 <span id="zone2"></span></div>
        <div class="zone">Zone 3 <span id="zone3"></span></div>
        <div class="zone">Total animals: <span id="total"></span></div>
        </div>

        <br>
        <button onclick="openZoo()">Open the Zoo!</button>
        <p id="zoo-status"></p>
        <script>
        function openZoo() {
            document.getElementById("zone1").innerHTML = "Lion";

            document.getElementById("zone2").innerHTML = "Monkey";

            document.getElementById("zone3").innerHTML = "Girrafe";

            document.getElementById("total").innerHTML = "3";

            document.getElementById("zoo").style.backgroundColor = "Orange";

            document.getElementById("zoo-status").innerHTML = document.title + " is now open!"
        }
        </script>   
</body>
</html>
